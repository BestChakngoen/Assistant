<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assistant</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Rajdhani:wght@500;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS (Compiled) -->
    <link rel="stylesheet" href="dist/style.css">
    <link rel="stylesheet" href="css/style-share.css">

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Chart.js Data Labels Plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>

    <!-- QRCode.js for Local Device Sharing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- Supabase Client JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body class="text-slate-200 min-h-screen flex flex-col items-center justify-center">

    <!-- LOGIN SCREEN CONTAINER -->
    <div id="login-view-mount"></div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-content" class="hidden w-full min-h-screen flex bg-[#080b11] text-slate-100 overflow-hidden relative">
        <!-- Sidebar Navigation -->
        <div id="sidebar-view-mount"></div>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col min-w-0 overflow-hidden lg:pl-64">
            <!-- Top Header -->
            <div id="header-view-mount"></div>

            <!-- Scrollable Content Grid (Tabs & Modals) -->
            <main id="main-view-mount" class="flex-1 overflow-y-auto p-4 md:p-6 bg-[#080b11]">
            </main>
        </div>
    </div>

    <!-- MAIN SCRIPT (OOP MODULES) -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { initViewComponents } from './js/views/ViewLoader.js';
        import { TradeApp } from './js/main.js';
        import { initLayoutSync } from './js/ui/helpers/layoutSync.js';
        import { initPhonkRunner } from './js/ui/games/phonkRunner.js';

        // 1. Mount Modular View Components
        initViewComponents();

        // 2. Firebase & App Bootstrap
        const userFirebaseConfig = {
            apiKey: "AIzaSyB5fy6zul5grXI2IPi8SmV_ciU_h5nD4cE",
            authDomain: "trade-journal-d51d8.firebaseapp.com",
            projectId: "trade-journal-d51d8",
            storageBucket: "trade-journal-d51d8.firebasestorage.app",
            messagingSenderId: "990372526017",
            appId: "1:990372526017:web:4411df49e415ce1d49e140",
            measurementId: "G-QM7JRHJ60Q"
        };
        const appId = (typeof __app_id !== 'undefined') ? __app_id : 'default-app-id';

        const app = new TradeApp(userFirebaseConfig, appId);
        window.app = app;

        // 3. Layout Sync & Games Initialization
        initLayoutSync();
        initPhonkRunner();

        // 4. Clock & Date Update Loop
        const updateHeaderClock = () => {
            const now = new Date();
            const optionDate = { timeZone: 'Asia/Bangkok', day: '2-digit', month: 'short', year: 'numeric' };
            const optionTime = { timeZone: 'Asia/Bangkok', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
            
            const dateString = now.toLocaleDateString('en-GB', optionDate);
            const timeString = now.toLocaleTimeString('en-US', optionTime);

            const headerDateEl = document.getElementById('header-date');
            const headerTimeEl = document.getElementById('header-time');

            if (headerDateEl) headerDateEl.innerText = dateString;
            if (headerTimeEl) headerTimeEl.innerText = timeString;
        };

        updateHeaderClock();
        setInterval(updateHeaderClock, 1000);

        // 5. Sidebar mobile toggle
        window.toggleSidebar = function() {
            const sidebar = document.getElementById('sidebar');
            if (sidebar) {
                sidebar.classList.toggle('-translate-x-full');
            }
        };

        // Auto-close sidebar on screen shrink
        window.addEventListener('resize', () => {
            if (window.innerWidth < 1024) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                    sidebar.classList.add('-translate-x-full');
                }
            }
        });

        // Close sidebar on mobile interaction
        document.addEventListener('click', (e) => {
            if (window.innerWidth < 1024) {
                const sidebar = document.getElementById('sidebar');
                const hamburger = document.querySelector('button[onclick="window.toggleSidebar()"]');
                
                if (sidebar && !sidebar.classList.contains('-translate-x-full')) {
                    if (sidebar.contains(e.target)) {
                        if (e.target.closest('a') || (e.target.closest('button') && !e.target.closest('#tab-learning'))) {
                            sidebar.classList.add('-translate-x-full');
                        }
                    } else if (!hamburger || !hamburger.contains(e.target)) {
                        sidebar.classList.add('-translate-x-full');
                    }
                }
            }
        });

        // Toggle Learning Submenu
        window.toggleLearningMenu = function() {
            const submenu = document.getElementById('learning-submenu');
            const chevron = document.getElementById('learning-chevron');
            const btn = document.getElementById('tab-learning');
            if (submenu) {
                const isHidden = submenu.classList.contains('hidden');
                if (isHidden) {
                    submenu.classList.remove('hidden');
                    if (chevron) chevron.classList.add('rotate-180');
                    if (btn) {
                        btn.classList.remove('text-slate-400', 'border-transparent');
                        btn.classList.add('text-cyan-400', 'border-cyan-500/50');
                    }
                } else {
                    submenu.classList.add('hidden');
                    if (chevron) chevron.classList.remove('rotate-180');
                    if (btn) {
                        btn.classList.add('text-slate-400', 'border-transparent');
                        btn.classList.remove('text-cyan-400', 'border-cyan-500/50');
                    }
                }
            }
        };
    </script>
</body>

</html>
