<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineering - Interactive Game Space</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Rajdhani:wght@500;750&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (Compiled stylesheet from the main workspace) -->
    <link rel="stylesheet" href="../dist/style.css">
    <!-- Module Dedicated CSS -->
    <link rel="stylesheet" href="../css/learning-software.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="text-slate-200 min-h-screen flex flex-col p-4 sm:p-5 lg:p-6 w-full">

    <!-- Header Panel -->
    <header class="w-full flex items-center justify-between pb-4 mb-5 border-b border-slate-800/80 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i data-lucide="gamepad-2" class="w-5.5 h-5.5 text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Software Quest</h1>
                <p class="text-[10px] text-cyan-400 font-mono tracking-wider uppercase rajdhani">Interactive Game-Based Learning Sandbox</p>
            </div>
        </div>
        
        <a href="../TrackerView.html" class="btn-press flex items-center gap-1.5 px-3 py-2 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500/50 rounded-xl text-slate-300 hover:text-cyan-400 transition-all font-mono text-[10px] shadow-lg">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Workspace</span>
        </a>
    </header>

    <!-- Main Workspace Layout -->
    <div class="w-full flex flex-row gap-5 items-stretch grow h-[700px] lg:h-[calc(100vh-190px)] min-h-[600px]">
        
        <!-- LEFT COLUMN: SIDEBAR MENU -->
        <aside class="w-[260px] shrink-0 flex flex-col">
            <div class="glass-panel p-4 rounded-3xl border border-slate-800/85 bg-slate-900/30 flex flex-col gap-4 h-full">
                <div class="border-b border-slate-800/60 pb-3 flex items-center justify-between shrink-0">
                    <h3 class="text-xs font-mono font-bold tracking-widest text-slate-400 uppercase flex items-center gap-1.5">
                        <i data-lucide="compass" class="w-4 h-4 text-cyan-400"></i> Course Navigation
                    </h3>
                    <span id="global-progress" class="text-[9px] font-mono font-bold text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded-full border border-cyan-500/20">Overall: 0%</span>
                </div>

                <!-- Independent vertical scrolling syllabus container -->
                <div class="sidebar-scroll overflow-y-auto pr-1 flex-grow flex flex-col gap-2">
                    <div class="flex flex-col gap-2" id="accordion-menu-container">
                        <!-- Accordion panels dynamically drawn -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- RIGHT COLUMN: MAIN PLATFORM BOARD -->
        <section class="grow shrink min-w-0 flex flex-col">
            <div id="quest-board" class="w-full glass-panel p-5 sm:p-6 rounded-3xl border border-slate-800/80 bg-slate-900/40 flex flex-col gap-5 grow justify-between h-full overflow-y-auto sidebar-scroll">
                <!-- Loaded dynamically -->
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer class="w-full text-center text-[10px] text-slate-550 pt-4 mt-5 border-t border-slate-800/40 font-mono shrink-0">
        Learning Others Module &copy; 2026
    </footer>

    <!-- Success Confetti Overlay Modal -->
    <div id="success-modal" class="fixed inset-0 bg-[#05070c]/90 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="glass-panel p-6 rounded-3xl max-w-sm w-full border border-emerald-500/30 text-center relative overflow-hidden flex flex-col items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center animate-bounce">
                <i data-lucide="check-circle" class="w-7 h-7"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-white">MISSION ACCOMPLISHED!</h3>
                <p class="text-xs text-slate-400 mt-2 leading-relaxed">
                    คุณแก้สโคปตัวแปรและประเภทการประกาศได้สมบูรณ์แบบ ยาน Apollo-XI สามารถจุดระเบิดเครื่องยนต์และเดินทางสู่อวกาศได้สำเร็จ!
                </p>
            </div>
            <button id="btn-close-modal" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-bold font-mono text-xs transition btn-press border border-emerald-400/20">
                PROCEED TO NEXT QUEST
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT MODULE CONTROLLER -->
    <script type="module">
        import { SoftwareQuestController } from '../js/learning/software.js';

        document.addEventListener('DOMContentLoaded', () => {
            const controller = new SoftwareQuestController();
            controller.init();
            window.softwareQuest = controller;

            const btnCloseModal = document.getElementById('btn-close-modal');
            if (btnCloseModal) {
                btnCloseModal.onclick = () => controller.closeSuccessModal();
            }
        });
    </script>
</body>
</html>
