<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Software Engineering - Interactive Game Space</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Rajdhani:wght@500;750&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (Compiled stylesheet from the main workspace) -->
    <link rel="stylesheet" href="../dist/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #05070c;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .rajdhani {
            font-family: 'Rajdhani', sans-serif;
        }
        /* Custom anims for spaceship */
        @keyframes launch {
            0% { transform: translateY(0) scale(1); opacity: 1; filter: drop-shadow(0 0 10px rgba(6, 182, 212, 0.5)); }
            30% { transform: translateY(-10px) rotate(1deg); filter: drop-shadow(0 0 25px rgba(236, 72, 153, 0.8)); }
            100% { transform: translateY(-500px) scale(0.2); opacity: 0; }
        }
        @keyframes hover-ship {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(-0.5deg); }
        }
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20%, 60% { transform: translate(-4px, 2px) rotate(-1deg); }
            40%, 80% { transform: translate(4px, -2px) rotate(1deg); }
        }
        .animate-launch {
            animation: launch 2.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        .animate-hover-ship {
            animation: hover-ship 3s ease-in-out infinite;
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out infinite;
        }
        
        /* Independent scrolling for left menu */
        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.15);
            border-radius: 99px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(56, 189, 248, 0.3);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col p-4 sm:p-5 lg:p-6 w-full">

    <!-- Header Panel (Full width, no max-w-7xl restriction) -->
    <header class="w-full flex items-center justify-between pb-4 mb-5 border-b border-slate-800/80 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
                <i data-lucide="gamepad-2" class="w-5.5 h-5.5 text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Software Quest</h1>
                <p class="text-[10px] text-cyan-400 font-mono tracking-wider uppercase rajdhani">Interactive Game-Based Learning Sandbox</p>
            </div>
        </div>
        
        <a href="../TrackerView.html" class="btn-press flex items-center gap-1.5 px-3 py-2 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500/50 rounded-xl text-slate-300 hover:text-cyan-400 transition-all font-mono text-[10px] shadow-lg">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Workspace</span>
        </a>
    </header>

    <!-- Main Workspace Layout: Locked Left-Right Split spanning 100% width -->
    <div class="w-full flex flex-row gap-5 items-stretch grow h-[700px] lg:h-[calc(100vh-190px)] min-h-[600px]">
        
        <!-- LEFT COLUMN: SIDEBAR MENU (Permanently 260px wide) -->
        <aside class="w-[260px] shrink-0 flex flex-col">
            <div class="glass-panel p-4 rounded-3xl border border-slate-800/85 bg-slate-900/30 flex flex-col gap-4 h-full">
                <div class="border-b border-slate-800/60 pb-3 flex items-center justify-between shrink-0">
                    <h3 class="text-xs font-mono font-bold tracking-widest text-slate-400 uppercase flex items-center gap-1.5">
                        <i data-lucide="compass" class="w-4 h-4 text-cyan-400"></i> Course Navigation
                    </h3>
                    <span id="global-progress" class="text-[9px] font-mono font-bold text-cyan-400 bg-cyan-500/10 px-2 py-0.5 rounded-full border border-cyan-500/20">Overall: 0%</span>
                </div>

                <!-- Independent vertical scrolling syllabus container -->
                <div class="sidebar-scroll overflow-y-auto pr-1 flex-grow flex flex-col gap-2">
                    <div class="flex flex-col gap-2" id="accordion-menu-container">
                        <!-- Accordion panels dynamically drawn -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- RIGHT COLUMN: MAIN PLATFORM BOARD (Stretches to fill 100% of remaining width) -->
        <section class="grow shrink min-w-0 flex flex-col">
            <div id="quest-board" class="w-full glass-panel p-5 sm:p-6 rounded-3xl border border-slate-800/80 bg-slate-900/40 flex flex-col gap-5 grow justify-between h-full overflow-y-auto sidebar-scroll">
                <!-- Loaded dynamically by selectStage() -->
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer class="w-full text-center text-[10px] text-slate-550 pt-4 mt-5 border-t border-slate-800/40 font-mono shrink-0">
        Learning Others Module &copy; 2026
    </footer>

    <!-- Success Confetti Overlay Modal -->
    <div id="success-modal" class="fixed inset-0 bg-[#05070c]/90 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="glass-panel p-6 rounded-3xl max-w-sm w-full border border-emerald-500/30 text-center relative overflow-hidden flex flex-col items-center gap-4">
            <div class="w-14 h-14 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 flex items-center justify-center animate-bounce">
                <i data-lucide="check-circle" class="w-7 h-7"></i>
            </div>
            <div>
                <h3 class="text-lg font-bold text-white">MISSION ACCOMPLISHED!</h3>
                <p class="text-xs text-slate-400 mt-2 leading-relaxed">
                    คุณแก้สโคปตัวแปรและประเภทการประกาศได้สมบูรณ์แบบ ยาน Apollo-XI สามารถจุดระเบิดเครื่องยนต์และเดินทางสู่อวกาศได้สำเร็จ!
                </p>
            </div>
            <button onclick="closeSuccessModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-bold font-mono text-xs transition btn-press border border-emerald-400/20">
                PROCEED TO NEXT QUEST
            </button>
        </div>
    </div>

    <!-- JAVASCRIPT CONTROLLER LOGIC -->
    <script>
        // Core Curriculum Data Mapping
        const topicData = {
            programming: {
                title: "Programming Fundamentals",
                prefix: "💻 01",
                colorClass: "from-cyan-500 to-blue-600",
                badgeColor: "bg-cyan-500/10 border-cyan-500/20 text-cyan-400",
                desc: "เลือกภาษาหลัก 1-2 ภาษาและเข้าใจมันอย่างลึกซึ้ง เช่น JavaScript/TypeScript (เว็บ/ฟูลสแต็ก), Python (AI/Data/Automation), หรือ Go / Java / C# (ระบบองค์กรใหญ่) เข้าใจเรื่อง Logic, OOP และ Control Flows",
                stages: [
                    { title: "Variable Scope & Declaration", active: true },
                    { title: "Control Flows (Condition/Loops)" },
                    { title: "Object-Oriented Logic (OOP)" },
                    { title: "Functions & Closures" },
                    { title: "Logic & Boolean Algebra" }
                ]
            },
            dsa: {
                title: "Data Structures & Algorithms",
                prefix: "🧠 02",
                colorClass: "from-violet-500 to-fuchsia-600",
                badgeColor: "bg-violet-500/10 border-violet-500/20 text-violet-400",
                desc: "โครงสร้างข้อมูลและอัลกอริทึม (Arrays, Hash Tables, Trees, Sorting, Searching) สำหรับงานและ Technical Interview",
                stages: [
                    { title: "Big O Complexity Analysis" },
                    { title: "Linear Arrays & LinkedLists" },
                    { title: "Hash Tables & Map Storage" },
                    { title: "BST Hierarchical Trees" },
                    { title: "Sorting & Binary Searching" }
                ]
            },
            git: {
                title: "Version Control (Git & GitHub)",
                prefix: "🔀 03",
                colorClass: "from-blue-500 to-indigo-600",
                badgeColor: "bg-blue-500/10 border-blue-500/20 text-blue-400",
                desc: "เครื่องมือที่นักพัฒนาทุกคนต้องใช้ทำงานร่วมกันในทีม ฝึกการ Commit, Push, Pull, Branching และการแก้ไข Code Conflicts",
                stages: [
                    { title: "Git init & local commits" },
                    { title: "Remote pushes & pull requests" },
                    { title: "Branching workflows" },
                    { title: "Resolving file code conflicts" },
                    { title: "Team Code Reviews on GitHub" }
                ]
            },
            database: {
                title: "Database Foundations",
                prefix: "🗄️ 04",
                colorClass: "from-amber-500 to-orange-600",
                badgeColor: "bg-amber-500/10 border-amber-500/20 text-amber-400",
                desc: "วิธีการเก็บและจัดการข้อมูล ทั้งแบบ Relational Database (SQL เช่น PostgreSQL, MySQL) และ NoSQL (เช่น MongoDB, Redis)",
                stages: [
                    { title: "Schemas & Primary Key constraints" },
                    { title: "SQL Queries and filters" },
                    { title: "Relational Table JOINs" },
                    { title: "NoSQL document storage & caching" },
                    { title: "Transactions & ACID integrity" }
                ]
            },
            network: {
                title: "Web & Network Basics",
                prefix: "🌐 05",
                colorClass: "from-emerald-500 to-teal-600",
                badgeColor: "bg-emerald-500/10 border-emerald-500/20 text-emerald-455",
                desc: "เข้าใจการทำงานของระบบเน็ตเวิร์กพื้นฐาน HTTP/HTTPS, RESTful API, JSON และสถาปัตยกรรมแบบ Client-Server",
                stages: [
                    { title: "Client-Server System architecture" },
                    { title: "HTTP methods lifecycle" },
                    { title: "HTTP Status Codes responses" },
                    { title: "RESTful API formatting conventions" },
                    { title: "HTTPS SSL & CORS headers" }
                ]
            },
            "clean-code": {
                title: "Clean Code & SOLID",
                prefix: "✨ 06",
                colorClass: "from-pink-500 to-rose-600",
                badgeColor: "bg-pink-500/10 border-pink-500/20 text-pink-400",
                desc: "หลักการเขียนโค้ดให้อ่านง่าย บำรุงรักษาง่าย ไม่ซับซ้อน และสามารถขยายระบบต่อได้ในอนาคต",
                stages: [
                    "Meaningful naming standards",
                    "DRY & KISS guidelines",
                    "Single Responsibility (SRP)",
                    "Open/Closed Principle (OCP)",
                    "Refactoring patterns"
                ].map(s => ({ title: s }))
            },
            architecture: {
                title: "Software Design & Arch",
                prefix: "🏗️ 07",
                colorClass: "from-indigo-500 to-purple-600",
                badgeColor: "bg-indigo-500/10 border-indigo-500/20 text-indigo-405",
                desc: "เรียนรู้สถาปัตยกรรมระบบ เช่น Monolith vs. Microservices, MVC Pattern และ Design Patterns ต่างๆ เพื่อสร้างระบบที่รองรับผู้ใช้",
                stages: [
                    "Monolith vs Microservices patterns",
                    "MVC Architecture separation",
                    "Design Patterns structure",
                    "System Scalability & Load Balancing"
                ].map(s => ({ title: s }))
            },
            cloud: {
                title: "Container & Cloud",
                prefix: "🐳 08",
                colorClass: "from-blue-500 to-sky-600",
                badgeColor: "bg-blue-500/10 border-blue-500/20 text-blue-400",
                desc: "การแพ็กแอปพลิเคชันด้วย Docker และความเข้าใจเบื้องต้นเกี่ยวกับบริการ Cloud ยอดนิยม (AWS, Google Cloud หรือ Azure)",
                stages: [
                    "Writing Dockerfiles & configs",
                    "Docker Compose operations",
                    "Virtual Cloud Instance compute",
                    "S3 Object storage system"
                ].map(s => ({ title: s }))
            },
            "ai-assisted": {
                title: "AI-Assisted Dev",
                prefix: "🤖 09",
                colorClass: "from-purple-500 to-pink-600",
                badgeColor: "bg-purple-500/10 border-purple-500/20 text-purple-400",
                desc: "ทักษะการใช้เครื่องมือ AI (เช่น GitHub Copilot, Cursor) ในการช่วยเขียนโค้ด ดีบัก และเพิ่ม Productivity",
                stages: [
                    "AI developer prompt engineering",
                    "Debugging errors with AI models",
                    "AI Refactoring and standards",
                    "Generating unit tests automatically"
                ].map(s => ({ title: s }))
            },
            "testing-cicd": {
                title: "Testing & CI/CD",
                prefix: "🧪 10",
                colorClass: "from-teal-500 to-emerald-600",
                badgeColor: "bg-teal-500/10 border-teal-500/20 text-teal-455",
                desc: "การเขียน Unit Test, Integration Test และการตั้งค่าระบบ Automated Pipelines เพื่อตรวจสอบและ Deploy โค้ดโดยอัตโนมัติ",
                stages: [
                    "Unit testing components Jest",
                    "Integration test environment setup",
                    "GitHub Actions workflow pipeline",
                    "Automated packaging & deploy"
                ].map(s => ({ title: s }))
            },
            security: {
                title: "Web Security Basics",
                prefix: "🛡️ 11",
                colorClass: "from-red-500 to-rose-600",
                badgeColor: "bg-red-500/10 border-red-500/20 text-red-400",
                desc: "ความปลอดภัยขั้นพื้นฐาน (OWASP Top 10) เช่น การจัดการสิทธิ์ (Authentication & Authorization) ด้วย JWT และการเข้ารหัสข้อมูล",
                stages: [
                    "OWASP Top 10 vulnerabilities list",
                    "JWT Auth structure & validation",
                    "Password secure bcrypt hashes",
                    "CORS origins & HTTP Security Headers"
                ].map(s => ({ title: s }))
            }
        };

        // State variables
        let activeTopicKey = 'programming';
        let activeStageIndex = 0;
        let progressStore = JSON.parse(localStorage.getItem('software_game_progress_v2')) || {};

        // Render Left Navigation Accordion
        function renderSyllabusMenu() {
            const menuContainer = document.getElementById('accordion-menu-container');
            menuContainer.innerHTML = '';

            Object.keys(topicData).forEach(key => {
                const topic = topicData[key];
                const isExpanded = key === activeTopicKey;

                // Accordion Panel Wrapper
                const panel = document.createElement('div');
                panel.className = `border rounded-2xl overflow-hidden transition-all bg-slate-950/20 border-slate-900/80`;

                // Accordion Trigger Header
                const header = document.createElement('button');
                header.className = `w-full flex items-center justify-between px-3.5 py-3 transition-colors text-left hover:bg-slate-800/25 ${
                    isExpanded ? 'border-b border-slate-855 bg-slate-900/10 text-cyan-400 font-bold' : 'text-slate-355'
                }`;
                header.onclick = () => toggleTopic(key);

                header.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="text-[10px] font-mono text-slate-500 uppercase shrink-0">${topic.prefix}</span>
                        <span class="text-xs truncate">${topic.title}</span>
                    </div>
                    <i data-lucide="chevron-${isExpanded ? 'down' : 'right'}" class="w-3.5 h-3.5 text-slate-550 shrink-0 transition-transform"></i>
                `;
                panel.appendChild(header);

                // Expanded Quest/Stages List container
                if (isExpanded) {
                    const stagesList = document.createElement('div');
                    stagesList.className = 'p-1.5 space-y-1 bg-[#090d16]/30';

                    topic.stages.forEach((stage, idx) => {
                        const isStageActive = idx === activeStageIndex;
                        const isStageCompleted = !!progressStore[`${key}_${idx}`];

                        const stageBtn = document.createElement('button');
                        stageBtn.className = `w-full flex items-center gap-2 px-3 py-2 rounded-xl text-left text-[11px] transition-all border ${
                            isStageActive 
                                ? 'bg-cyan-550/15 border-cyan-500/30 text-cyan-400 font-bold shadow-md' 
                                : isStageCompleted
                                    ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-450 hover:text-emerald-355'
                                    : 'bg-transparent border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/20'
                        }`;
                        stageBtn.onclick = () => selectQuestStage(idx);

                        let stageIcon = 'lock';
                        if (key === 'programming' && idx === 0) stageIcon = 'rocket';
                        else if (isStageCompleted) stageIcon = 'check';
                        else if (idx === 0 || isStageCompleted) stageIcon = 'play-circle';

                        stageBtn.innerHTML = `
                            <i data-lucide="${stageIcon}" class="w-3.5 h-3.5 shrink-0 ${isStageActive ? 'text-cyan-400' : isStageCompleted ? 'text-emerald-400' : 'text-slate-555'}"></i>
                            <span class="truncate flex-grow">${idx + 1}. ${stage.title}</span>
                            ${isStageActive ? '<span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-pulse shrink-0"></span>' : ''}
                        `;
                        stagesList.appendChild(stageBtn);
                    });

                    panel.appendChild(stagesList);
                }

                menuContainer.appendChild(panel);
            });

            if (window.lucide) window.lucide.createIcons();
            updateGlobalBadge();
        }

        // Expand/Collapse Accordion topic (accordion header click handler)
        function toggleTopic(topicKey) {
            if (activeTopicKey === topicKey) {
                // Clicking expanded topic collapses it (Custom toggle stages behaviour)
                activeTopicKey = null;
            } else {
                activeTopicKey = topicKey;
                activeStageIndex = 0; // Reset stage to 1st on topic swap
            }
            renderSyllabusMenu();
            renderQuestContent();
        }

        // Select quest stage item
        function selectQuestStage(stageIdx) {
            activeStageIndex = stageIdx;
            renderSyllabusMenu();
            renderQuestContent();
        }

        // Render gameplay sandbox on the right (Using a balanced layout to prevent squeezing)
        function renderQuestContent() {
            const board = document.getElementById('quest-board');
            
            // Render beautiful welcome panel if all topics are collapsed
            if (!activeTopicKey) {
                board.innerHTML = `
                    <div class="flex flex-col gap-6 text-center py-16 max-w-xl mx-auto items-center justify-center h-full">
                        <div class="w-16 h-16 rounded-2xl bg-cyan-500/10 border border-cyan-500/30 text-cyan-400 flex items-center justify-center animate-bounce">
                            <i data-lucide="compass" class="w-8 h-8"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white tracking-wide">ยินดีต้อนรับสู่ Software Engineering Quest</h2>
                            <p class="text-xs text-slate-455 mt-2.5 leading-relaxed">
                                เลือกหัวข้อวิชาการจากเมนูสารบัญด้านซ้าย เพื่อเริ่มสำรวจรายละเอียดด่านและมีปฏิสัมพันธ์กับแบบจำลอง Simulator ด้านการเขียนโค้ดซอฟต์แวร์
                            </p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 w-full mt-6">
                            <div class="bg-slate-900/60 p-4.5 rounded-2xl border border-slate-850/60 text-center">
                                <span class="block text-[9px] text-slate-500 font-mono uppercase tracking-wider">หัวข้อการเรียนรู้</span>
                                <span class="text-lg font-bold text-white mt-1 block">11 หมวดหลัก</span>
                            </div>
                            <div class="bg-slate-900/60 p-4.5 rounded-2xl border border-slate-850/60 text-center">
                                <span class="block text-[9px] text-slate-500 font-mono uppercase tracking-wider">ความคืบหน้าโดยรวม</span>
                                <span id="overview-progress-pct" class="text-lg font-bold text-cyan-400 mt-1 block">0%</span>
                            </div>
                        </div>
                    </div>
                `;
                if (window.lucide) window.lucide.createIcons();
                updateOverviewProgress();
                return;
            }

            const topic = topicData[activeTopicKey];
            const stage = topic.stages[activeStageIndex];

            // Render Active Interactive Game for programming Quest 1
            if (activeTopicKey === 'programming' && activeStageIndex === 0) {
                board.innerHTML = `
                    <!-- GAMEPLAY WRAPPER (Fits visible viewport, pushes lesson explanation down) -->
                    <div class="flex flex-col justify-between grow gap-5 min-h-[580px] lg:min-h-[calc(100vh-210px)] shrink-0">
                        
                        <!-- BOARD HEADER -->
                        <div class="w-full flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800/60 pb-4 shrink-0">
                            <div>
                                <span class="px-2.5 py-0.5 rounded bg-cyan-500/10 border border-cyan-500/20 text-[9px] font-mono font-bold text-cyan-400 uppercase tracking-widest">
                                    Quest 01 — Variable Scope & Declaration
                                </span>
                                <h2 class="text-base font-bold text-white mt-1 flex items-center gap-2">
                                    🚀 Spaceship Launch Protocol
                                </h2>
                            </div>
                            <div class="text-left sm:text-right shrink-0">
                                <span class="block text-[8px] text-slate-500 font-mono">LAUNCH STATUS</span>
                                <span id="launch-status-badge" class="inline-block text-[10px] font-mono font-bold px-2.5 py-0.5 rounded-full bg-slate-950 text-slate-500 border border-slate-850">STANDBY</span>
                            </div>
                        </div>

                        <!-- SPACIOUS PLATFORM: Full width 50/50 split -->
                        <div class="w-full grid grid-cols-1 md:grid-cols-2 gap-6 items-stretch grow">
                            <!-- Left Panel: Graphic Simulator -->
                            <div class="glass-panel p-5 rounded-2xl bg-slate-950/40 border border-slate-855 flex flex-col justify-between overflow-hidden relative min-h-[280px]">
                                <div class="absolute inset-0 bg-gradient-to-b from-cyan-950/5 to-transparent pointer-events-none"></div>
                                <h4 class="text-[9px] font-mono tracking-wider text-slate-500 uppercase flex items-center gap-1.5 z-10">
                                    <span class="w-1.5 h-1.5 rounded-full bg-cyan-400 animate-ping"></span> Live Engine Telemetry
                                </h4>
                                
                                <div class="flex-grow flex items-center justify-center relative py-8">

        // Variable scope launcher simulation code execution logic
        function executeProtocol() {
            const shipNameType = document.getElementById('sel-name').value;
            const fuelLevelType = document.getElementById('sel-fuel').value;
            const speedType = document.getElementById('sel-speed').value;
            const consoleEl = document.getElementById('terminal-console');
            const shipContainer = document.getElementById('spaceship-container');
            const thrust = document.getElementById('thrust-effect');

            // Reset UI states
            consoleEl.className = "font-mono";
            shipContainer.className = "relative animate-hover-ship";
            thrust.classList.add('hidden');

            if (!shipNameType || !fuelLevelType || !speedType) {
                consoleEl.innerText = "Console: Error: Compilation Failed. Missing declaration type selections!";
                consoleEl.classList.add('text-red-400');
                return;
            }
            
            // Scope evaluation rules
            if (fuelLevelType === 'const') {
                consoleEl.innerText = "Console: TypeError: Assignment to constant variable 'fuelLevel' at launch (line 15). Spacecraft engine failed!";
                consoleEl.classList.add('text-red-400');
                shipContainer.classList.add('animate-shake');
                return;
            }

            if (speedType === 'let' || speedType === 'const') {
                consoleEl.innerText = "Console: ReferenceError: 'speed' is not defined at launch (line 18) due to Block Scope boundary!";
                consoleEl.classList.add('text-red-400');
                shipContainer.classList.add('animate-shake');
                return;
            }

            if (shipNameType !== 'const') {
                consoleEl.innerText = "Console: Code warning: 'shipName' should be declared with 'const' since its value is never reassigned. Launch aborted due to unsafe standards!";
                consoleEl.classList.add('text-amber-400');
                return;
            }

            // SUCCESS STATE!
            consoleEl.innerText = "Console: Compilation successful! Speed reached: 25000 km/h. Fuel consumption normal. Spaceship launched!";
            consoleEl.classList.add('text-green-400');
            
            // Telemetry updates
            document.getElementById('telemetry-speed').innerText = "25,000 km/h";
            document.getElementById('telemetry-fuel').innerText = "80%";
            document.getElementById('launch-status-badge').innerText = "SUCCESS";
            document.getElementById('launch-status-badge').className = "inline-block text-[10px] font-mono font-bold px-2.5 py-0.5 rounded-full bg-green-500/10 border border-green-500/30 text-green-400";
            
            // Trigger animation
            thrust.classList.remove('hidden');
            shipContainer.className = "relative animate-launch";

            // Save state & mark current stage as completed
            progressStore[`${activeTopicKey}_${activeStageIndex}`] = true;
            localStorage.setItem('software_game_progress_v2', JSON.stringify(progressStore));

            // Open Success Modal after launch complete
            setTimeout(() => {
                document.getElementById('success-modal').classList.remove('hidden');
                renderSyllabusMenu(); // Refresh stepper progress

        // Calculate progress percentage for active module
        function updateCalculatedProgress() {
            const topic = topicData[activeTopicKey];

            topic.stages.forEach((_, idx) => {
                if (progressStore[`${activeTopicKey}_${idx}`]) completed++;
            });

        // Calculate global overall progress across all modules
        function updateGlobalBadge() {
            let totalStages = 0;
            let completedStages = 0;
            
            Object.keys(topicData).forEach(topicId => {

                totalStages += topic.stages.length;
                topic.stages.forEach((_, idx) => {
                    if (progressStore[`${topicId}_${idx}`]) completedStages++;

            });

            const overallPct = Math.round((completedStages / totalStages) * 100);
            const globalProgEl = document.getElementById('global-progress');
            if (globalProgEl) globalProgEl.innerText = `Overall: ${overallPct}%`;
        }

        // Calculate overview progress
        function updateOverviewProgress() {
            let totalStages = 0;
            let completedStages = 0;
            
            Object.keys(topicData).forEach(topicId => {
                const topic = topicData[topicId];
                totalStages += topic.stages.length;
                topic.stages.forEach((_, idx) => {
                    if (progressStore[`${topicId}_${idx}`]) completedStages++;
                });
            });

            const overallPct = Math.round((completedStages / totalStages) * 100);
            const overviewProgEl = document.getElementById('overview-progress-pct');
            if (overviewProgEl) overviewProgEl.innerText = `${overallPct}%`;
        }

        // Expansion helper
        document.addEventListener('DOMContentLoaded', () => {
            renderSyllabusMenu();
            renderQuestContent();
        });
    </script>
</body>
</html>
