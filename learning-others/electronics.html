<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electricity & Electronics - Interactive Sandbox</title>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&family=Rajdhani:wght@500;750&display=swap" rel="stylesheet">
    <!-- Tailwind CSS (Compiled stylesheet from the main workspace) -->
    <link rel="stylesheet" href="../dist/style.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Kanit', sans-serif;
            background-color: #05070c;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }
        .rajdhani {
            font-family: 'Rajdhani', sans-serif;
        }
        
        /* Webkit scrollbar styles */
        .sidebar-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .sidebar-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.15);
            border-radius: 99px;
        }
        .sidebar-scroll::-webkit-scrollbar-thumb:hover {
            background: rgba(245, 158, 11, 0.3);
        }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col p-4 sm:p-5 lg:p-6 w-full">

    <!-- Header Panel -->
    <header class="w-full flex items-center justify-between pb-4 mb-5 border-b border-slate-800/80 shrink-0">
        <div class="flex items-center gap-4">
            <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-amber-500 to-orange-600 flex items-center justify-center shadow-lg shadow-amber-500/20">
                <i data-lucide="zap" class="w-5.5 h-5.5 text-white"></i>
            </div>
            <div>
                <h1 class="text-lg font-bold text-white tracking-wide">Electricity & Electronics Quest</h1>
                <p class="text-[10px] text-amber-400 font-mono tracking-wider uppercase rajdhani">Interactive Hardware & Circuit Simulator</p>
            </div>
        </div>
        
        <a href="../TrackerView.html" class="btn-press flex items-center gap-1.5 px-3 py-2 bg-slate-900/60 hover:bg-slate-800 border border-slate-800 hover:border-amber-500/50 rounded-xl text-slate-300 hover:text-amber-400 transition-all font-mono text-[10px] shadow-lg">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>Workspace</span>
        </a>
    </header>

    <!-- Main Workspace Layout -->
    <div class="w-full flex flex-row gap-5 items-stretch grow h-[700px] lg:h-[calc(100vh-190px)] min-h-[600px]">
        
        <!-- LEFT COLUMN: SIDEBAR MENU -->
        <aside class="w-[260px] shrink-0 flex flex-col">
            <div class="glass-panel p-4 rounded-3xl border border-slate-800/85 bg-slate-900/30 flex flex-col gap-4 h-full">
                <div class="border-b border-slate-800/60 pb-3 flex items-center justify-between shrink-0">
                    <h3 class="text-xs font-mono font-bold tracking-widest text-slate-400 uppercase flex items-center gap-1.5">
                        <i data-lucide="compass" class="w-4 h-4 text-amber-400"></i> Course Navigation
                    </h3>
                    <span id="global-progress" class="text-[9px] font-mono font-bold text-amber-400 bg-amber-500/10 px-2 py-0.5 rounded-full border border-amber-500/20">Overall: 0%</span>
                </div>

                <!-- Independent vertical scrolling syllabus container -->
                <div class="sidebar-scroll overflow-y-auto pr-1 flex-grow flex flex-col gap-2">
                    <div class="flex flex-col gap-2" id="accordion-menu-container">
                        <!-- Accordion panels dynamically drawn -->
                    </div>
                </div>
            </div>
        </aside>

        <!-- RIGHT COLUMN: MAIN PLATFORM BOARD -->
        <section class="grow shrink min-w-0 flex flex-col">
            <div id="quest-board" class="w-full glass-panel p-5 sm:p-6 rounded-3xl border border-slate-800/80 bg-slate-900/40 flex flex-col gap-5 grow justify-between h-full overflow-y-auto sidebar-scroll">
                <!-- Loaded dynamically by selectStage() -->
            </div>
        </section>

    </div>

    <!-- Footer -->
    <footer class="w-full text-center text-[10px] text-slate-550 pt-4 mt-5 border-t border-slate-800/40 font-mono shrink-0">
        Learning Others Module &copy; 2026
    </footer>

    <!-- JAVASCRIPT CONTROLLER LOGIC -->
    <script>
        // Core Curriculum Data Mapping
        const topicData = {
            microcontrollers: {
                title: "Microcontroller Systems",
                prefix: "🔌 01",
                stages: [
                    { title: "Arduino IDE & ESP32 Setup" },
                    { title: "GPIO Pins & Digital Output" },
                    { title: "Analog Reading & PWM Control" },
                    { title: "Sensor Interfacing (DHT11/I2C)" },
                    { title: "Power Management (Deep Sleep)" }
                ]
            },
            circuit: {
                title: "Circuit & PCB Design",
                prefix: "📐 02",
                stages: [
                    { title: "Schematic Components & Symbols" },
                    { title: "Power Rails & Ground Planes" },
                    { title: "PCB Trace Routing & Widths" },
                    { title: "Gerber Files Generation" },
                    { title: "SMD Soldering Techniques" }
                ]
            },
            iot: {
                title: "Internet of Things",
                prefix: "🌐 03",
                stages: [
                    { title: "Wi-Fi Connection Protocol" },
                    { title: "MQTT Publish & Subscribe" },
                    { title: "RESTful API Integration" },
                    { title: "Smart Home Dashboard Integrations" },
                    { title: "BLE Beacons and Advertising" }
                ]
            }
        };

        // State variables
        let activeTopicKey = 'microcontrollers';
        let activeStageIndex = 0;
        let progressStore = JSON.parse(localStorage.getItem('electronics_game_progress_v2')) || {};

        // Render Left Navigation Accordion
        function renderSyllabusMenu() {
            const menuContainer = document.getElementById('accordion-menu-container');
            menuContainer.innerHTML = '';

            Object.keys(topicData).forEach(key => {
                const topic = topicData[key];
                const isExpanded = key === activeTopicKey;

                const panel = document.createElement('div');
                panel.className = `border rounded-2xl overflow-hidden transition-all bg-slate-950/20 border-slate-900/80`;

                const header = document.createElement('button');
                header.className = `w-full flex items-center justify-between px-3.5 py-3 transition-colors text-left hover:bg-slate-800/25 ${
                    isExpanded ? 'border-b border-slate-855 bg-slate-900/10 text-amber-400 font-bold' : 'text-slate-355'
                }`;
                header.onclick = () => toggleTopic(key);

                header.innerHTML = `
                    <div class="flex items-center gap-2 min-w-0">
                        <span class="text-[10px] font-mono text-slate-500 uppercase shrink-0">${topic.prefix}</span>
                        <span class="text-xs truncate">${topic.title}</span>
                    </div>
                    <i data-lucide="chevron-${isExpanded ? 'down' : 'right'}" class="w-3.5 h-3.5 text-slate-550 shrink-0 transition-transform"></i>
                `;
                panel.appendChild(header);

                if (isExpanded) {
                    const stagesList = document.createElement('div');
                    stagesList.className = 'p-1.5 space-y-1 bg-[#090d16]/30';

                    topic.stages.forEach((stage, idx) => {
                        const isStageActive = idx === activeStageIndex;
                        const isStageCompleted = !!progressStore[`${key}_${idx}`];

                        const stageBtn = document.createElement('button');
                        stageBtn.className = `w-full flex items-center gap-2 px-3 py-2 rounded-xl text-left text-[11px] transition-all border ${
                            isStageActive 
                                ? 'bg-amber-500/15 border-amber-500/30 text-amber-400 font-bold shadow-md' 
                                : isStageCompleted
                                    ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-450 hover:text-emerald-355'
                                    : 'bg-transparent border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/20'
                        }`;
                        stageBtn.onclick = () => selectQuestStage(idx);

                        let stageIcon = 'lock';
                        if (isStageCompleted) stageIcon = 'check';
                        else if (idx === 0 || isStageCompleted) stageIcon = 'play-circle';

                        stageBtn.innerHTML = `
                            <i data-lucide="${stageIcon}" class="w-3.5 h-3.5 shrink-0 ${isStageActive ? 'text-amber-400' : isStageCompleted ? 'text-emerald-400' : 'text-slate-555'}"></i>
                            <span class="truncate flex-grow">${idx + 1}. ${stage.title}</span>
                            ${isStageActive ? '<span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse shrink-0"></span>' : ''}
                        `;
                        stagesList.appendChild(stageBtn);
                    });

                    panel.appendChild(stagesList);
                }

                menuContainer.appendChild(panel);
            });

            if (window.lucide) window.lucide.createIcons();
            updateGlobalBadge();
        }

        function toggleTopic(topicKey) {
            if (activeTopicKey === topicKey) {
                activeTopicKey = null;
            } else {
                activeTopicKey = topicKey;
                activeStageIndex = 0;
            }
            renderSyllabusMenu();
            renderQuestContent();
        }

        function selectQuestStage(stageIdx) {
            activeStageIndex = stageIdx;
            renderSyllabusMenu();
            renderQuestContent();
        }

        function renderQuestContent() {
            const board = document.getElementById('quest-board');
            
            if (!activeTopicKey) {
                board.innerHTML = `
                    <div class="flex flex-col gap-6 text-center py-16 max-w-xl mx-auto items-center justify-center h-full">
                        <div class="w-16 h-16 rounded-2xl bg-amber-500/10 border border-amber-500/30 text-amber-400 flex items-center justify-center animate-bounce">
                            <i data-lucide="zap" class="w-8 h-8"></i>
                        </div>
                        <div>
                            <h2 class="text-xl font-bold text-white tracking-wide">ยินดีต้อนรับสู่ Electronics Quest</h2>
                            <p class="text-xs text-slate-455 mt-2.5 leading-relaxed">
                                เลือกหัวข้อวิชาการจากเมนูสารบัญด้านซ้าย เพื่อเริ่มสำรวจรายละเอียดด่านและมีปฏิสัมพันธ์กับแบบจำลอง Simulator ด้านการไฟฟ้าและอิเล็กทรอนิกส์
                            </p>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 w-full mt-6">
                            <div class="bg-slate-900/60 p-4.5 rounded-2xl border border-slate-850/60 text-center">
                                <span class="block text-[9px] text-slate-500 font-mono uppercase tracking-wider">หัวข้อการเรียนรู้</span>
                                <span class="text-lg font-bold text-white mt-1 block">3 หมวดหลัก</span>
                            </div>
                            <div class="bg-slate-900/60 p-4.5 rounded-2xl border border-slate-850/60 text-center">
                                <span class="block text-[9px] text-slate-500 font-mono uppercase tracking-wider">ความคืบหน้าโดยรวม</span>
                                <span id="overview-progress-pct" class="text-lg font-bold text-amber-400 mt-1 block">0%</span>
                            </div>
                        </div>
                    </div>
                `;
                if (window.lucide) window.lucide.createIcons();
                updateOverviewProgress();
                return;
            }

            const topic = topicData[activeTopicKey];
            const stage = topic.stages[activeStageIndex];

            // Render LOCKED QUEST TEMPLATE
            board.innerHTML = `
                <!-- GAMEPLAY WRAPPER (Fits visible viewport, pushes lesson explanation down) -->
                <div class="flex flex-col justify-between grow gap-5 min-h-[580px] lg:min-h-[calc(100vh-210px)] shrink-0">
                    
                    <!-- BOARD HEADER -->
                    <div class="w-full flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800/60 pb-4 shrink-0">
                        <div>
                            <span class="px-2 py-0.5 rounded bg-amber-500/10 border border-amber-500/20 text-[9px] font-mono font-bold text-amber-400 uppercase tracking-widest">
                                Quest 0${activeStageIndex + 1} — Sandbox Blueprint
                            </span>
                            <h2 class="text-base font-bold text-white mt-1 flex items-center gap-2">
                                🛠️ ${stage.title}
                            </h2>
                        </div>
                        <div class="text-left sm:text-right shrink-0">
                            <span class="block text-[8px] text-slate-500 font-mono">STAGE STATUS</span>
                            <span class="inline-block text-[10px] font-mono font-bold px-2.5 py-0.5 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-400">UNDER DESIGN</span>
                        </div>
                    </div>

                    <!-- PLATFORM CONTENT: Full width (Single Column) -->
                    <div class="w-full grow flex flex-col gap-4">
                        <div class="glass-panel p-6 rounded-2xl bg-slate-950/80 border border-slate-855 flex flex-col justify-between flex-grow min-h-[300px]">
                            <div class="flex-grow flex flex-col items-center justify-center text-center p-6 gap-4">
                                <div class="w-14 h-14 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center text-amber-400/80 animate-pulse">
                                    <i data-lucide="wrench" class="w-6 h-6 text-amber-400"></i>
                                </div>
                                <div class="max-w-md">
                                    <h4 class="text-sm font-bold text-slate-200">ระบบจำลอง Sandbox กำลังอยู่ในระหว่างพัฒนา</h4>
                                    <p class="text-xs text-slate-400 mt-2 leading-relaxed font-sans">
                                        ขณะนี้ระบบการทดสอบและ Simulator ของหัวข้อ <strong>${topic.title}</strong> ในด่าน <strong>${stage.title}</strong> กำลังได้รับการออกแบบโครงสร้าง คาดว่าจะเปิดใช้งานในขั้นตอนถัดไป
                                    </p>
                                </div>
                            </div>
                            <div class="mt-4 bg-black/60 border border-slate-850 p-3 rounded-xl text-[10px] sm:text-xs text-slate-550 flex items-center gap-2.5">
                                <i data-lucide="info" class="w-4 h-4 text-amber-500 shrink-0"></i>
                                <span class="font-mono text-left">Console: [SYSTEM WAITING] Ready to compile ${stage.title} components once design parameters are set.</span>
                            </div>
                        </div>
                    </div>

                    <!-- BOARD FOOTER TARGETS -->
                    <div class="w-full flex flex-col md:flex-row items-stretch md:items-center justify-between gap-4 border-t border-slate-800/60 pt-4 shrink-0">
                        <div class="text-slate-400 text-xs">
                            <span class="font-bold text-white flex items-center gap-1.5"><i data-lucide="edit-3" class="w-3.5 h-3.5 text-amber-500"></i> Quest Designer:</span>
                            พร้อมร่วมออกแบบเงื่อนไขท้าทายสมองฝั่งฮาร์ดแวร์และวงจรไฟฟ้าในด่านนี้
                        </div>
                        <button disabled class="flex items-center justify-center gap-2 bg-slate-850 text-slate-650 font-mono font-bold px-6 py-2.5 rounded-xl border border-slate-800 text-xs cursor-not-allowed shrink-0">
                            <i data-lucide="lock" class="w-4 h-4"></i>
                            <span>UNDER CONSTRUCTION</span>
                        </button>
                    </div>
                </div>

                <!-- Lesson Explanation -->
                <div class="glass-panel p-5 rounded-2xl bg-slate-950/40 border border-slate-855 flex flex-col gap-3.5 mt-2 shrink-0">
                    <h4 class="text-xs font-bold text-white flex items-center gap-1.5 shrink-0">
                        <i data-lucide="book-open" class="w-4 h-4 text-amber-500"></i>
                        <span>คำอธิบายบทเรียน: ${stage.title}</span>
                    </h4>
                    <div class="text-[11px] text-slate-350 leading-relaxed overflow-y-visible pr-1.5 flex flex-col gap-3 select-text">
                        <p>
                            บทเรียนของหัวข้อ <strong>${topic.title}</strong> ในส่วนของ <strong>${stage.title}</strong> กำลังจัดเตรียมเนื้อหาทฤษฎีและคำอธิบายอย่างละเอียด
                        </p>
                        <div class="border-l-2 border-amber-500/50 pl-3.5 my-2 text-slate-400 italic font-sans">
                            "ความรู้ที่ดีไม่ได้เกิดจากการท่องจำ แต่เกิดจากการทำความเข้าใจโครงสร้างและการนำไปประยุกต์ใช้งาน..."
                        </div>
                        <p class="text-[10px] text-slate-500 border-t border-slate-900 pt-2 font-mono">
                            STATUS: Awaiting lesson content definitions and structural schematic maps.
                        </p>
                    </div>
                </div>
            `;

            if (window.lucide) window.lucide.createIcons();
            updateCalculatedProgress();
        }

        // Calculate progress percentage for active module
        function updateCalculatedProgress() {
            const topic = topicData[activeTopicKey];
            let completed = 0;
            topic.stages.forEach((_, idx) => {
                if (progressStore[`${activeTopicKey}_${idx}`]) completed++;
            });
        }

        // Calculate global overall progress across all modules
        function updateGlobalBadge() {
            let totalStages = 0;
            let completedStages = 0;
            
            Object.keys(topicData).forEach(topicId => {
                const topic = topicData[topicId];
                totalStages += topic.stages.length;
                topic.stages.forEach((_, idx) => {
                    if (progressStore[`${topicId}_${idx}`]) completedStages++;
                });
            });

            const overallPct = Math.round((completedStages / totalStages) * 100);
            const globalProgEl = document.getElementById('global-progress');
            if (globalProgEl) globalProgEl.innerText = `Overall: ${overallPct}%`;
        }

        // Calculate overview progress
        function updateOverviewProgress() {
            let totalStages = 0;
            let completedStages = 0;
            
            Object.keys(topicData).forEach(topicId => {
                const topic = topicData[topicId];
                totalStages += topic.stages.length;
                topic.stages.forEach((_, idx) => {
                    if (progressStore[`${topicId}_${idx}`]) completedStages++;
                });
            });

            const overallPct = Math.round((completedStages / totalStages) * 100);
            const overviewProgEl = document.getElementById('overview-progress-pct');
            if (overviewProgEl) overviewProgEl.innerText = `${overallPct}%`;
        }

        // Expansion helper
        document.addEventListener('DOMContentLoaded', () => {
            renderSyllabusMenu();
            renderQuestContent();
        });
    </script>
</body>
</html>
